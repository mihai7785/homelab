apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marketing-agent-home
  namespace: marketing-agent
  annotations:
    # local-path uses WaitForFirstConsumer; apply with the Deployment so the PVC can bind.
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
