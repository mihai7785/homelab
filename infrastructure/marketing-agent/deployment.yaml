apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-agent
  namespace: marketing-agent
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: marketing-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketing-agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-server-01
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      # Desktop gateway status/restart validates the live PID across containers.
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes
          # Local-only amd64 image imported on k3s-server-01 (2026-11-02).
          # Keep this fixed tag paired with imagePullPolicy: Never; rebuild and
          # reimport on that node before changing the image source or placement.
          image: localhost/marketing-agent:phase1-ef4b693f9079044e
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          env:
            # With a shared PID namespace tini is not PID 1; reap child tools.
            - name: TINI_SUBREAPER
              value: "1"
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef: { name: marketing-agent-serve-auth, key: username }
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef: { name: marketing-agent-serve-auth, key: password }
            - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: marketing-agent-serve-auth, key: signing-secret }
          ports:
            - { name: http, containerPort: 9119, protocol: TCP }
          startupProbe:
            exec:
              command:
                - /opt/hermes/.venv/bin/python
                - -c
                - "import socket; s=socket.create_connection(('127.0.0.1',9119),2); s.close()"
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /opt/hermes/.venv/bin/python
                - -c
                - "import socket; s=socket.create_connection(('127.0.0.1',9119),2); s.close()"
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /opt/hermes/.venv/bin/python
                - -c
                - "import socket; s=socket.create_connection(('127.0.0.1',9119),2); s.close()"
            periodSeconds: 30
          volumeMounts:
            - { name: home, mountPath: /opt/data }
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
        - name: gateway
          # One foreground gateway per HERMES_HOME; Kubernetes supervises this
          # container independently of hermes serve (no s6 or second API port).
          image: localhost/marketing-agent:phase1-ef4b693f9079044e
          imagePullPolicy: Never
          command: ["/usr/local/bin/marketing-tini", "-s", "-g", "--", "/bin/sh", "-ec"]
          args:
            - |
              test -w /opt/data
              mkdir -p "$XDG_RUNTIME_DIR"
              chmod 0700 "$XDG_RUNTIME_DIR"
              exec /opt/hermes/.venv/bin/hermes gateway run --no-supervise --external-supervisor
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          # A running process alone is not proof the scheduler/control loop is ready.
          # Do not make the serve Service endpoint Ready before the gateway replies.
          startupProbe:
            exec:
              command:
                - /opt/hermes/.venv/bin/python
                - -B
                - -c
                - 'from pathlib import Path; from gateway.control_socket import identify_gateway; i=identify_gateway(Path("/opt/data"), timeout=1.0); raise SystemExit(0 if i and i.get("pid") else 1)'
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /opt/hermes/.venv/bin/python
                - -B
                - -c
                - 'from pathlib import Path; from gateway.control_socket import identify_gateway; i=identify_gateway(Path("/opt/data"), timeout=1.0); raise SystemExit(0 if i and i.get("pid") else 1)'
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - { name: home, mountPath: /opt/data }
            - { name: gateway-tmp, mountPath: /tmp }
            - { name: gateway-shm, mountPath: /dev/shm }
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: marketing-agent-home
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: gateway-tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: gateway-shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
