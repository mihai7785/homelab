deployment:
  replicas: 1

providers:
  kubernetesCRD:
    allowCrossNamespace: true

service:
  type: LoadBalancer
  # Preserve the real LAN source IP for Traefik ipAllowList. Roll out only
  # after a Tier 3 approval and an explicit MetalLB L2/ingress check.
  spec:
    externalTrafficPolicy: Local

ports:
  web:
    port: 8000
    exposedPort: 80
  websecure:
    port: 8443
    exposedPort: 443

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
